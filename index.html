<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sarasota × Las Ninfas — Simulador de escenarios · Luxia Labs</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Roboto:ital,wght@0,300;0,400;0,500;0,700&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root{
  --ll-black:#000; --ll-blue:#1906F5; --blue-soft:#8f9dff;
  --ink-800:#15161A; --ink-700:#232429; --ink-600:#3A3B42; --ink-500:#5C5E66;
  --ink-400:#888A92; --ink-300:#B4B6BD; --ink-200:#D6D7DC; --ink-100:#E8E9ED;
  --ink-050:#F4F4F7; --ink-000:#FAFAFC; --blue-100:#E5E2FF; --blue-050:#F2F0FF;
  --fd:'Manrope',ui-sans-serif,system-ui,sans-serif;
  --fs:'Roboto',ui-sans-serif,system-ui,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,monospace;
  --warning:#C77A00; --warn-bg:#FFF6E6; --success:#0F8A4E; --succ-bg:#EAF7F0;
  --danger:#C0261E; --dang-bg:#FDEDEC;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fs);color:var(--ink-800);background:var(--ink-050);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
.shell{max-width:1080px;margin:0 auto;padding:0 22px}

.hero{background:var(--ll-black);color:#fff;border-bottom:3px solid var(--ll-blue)}
.hero .shell{padding:26px 22px 30px}
.mark{font-family:var(--fd);font-weight:800;font-size:17px}
.mark span{color:var(--blue-soft);font-style:italic;font-weight:600}
.hero h1{font-family:var(--fd);font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:20px;line-height:1.08}
.hero p{font-weight:300;color:rgba(255,255,255,.8);max-width:640px;margin-top:10px;font-size:15px}

.res{background:#fff;border-bottom:1px solid var(--ink-100);position:sticky;top:0;z-index:10;
  box-shadow:0 2px 14px rgba(0,0,0,.05)}
.res .shell{padding:16px 22px 14px}
.nums{display:flex;gap:34px;align-items:center;flex-wrap:wrap}
.big{display:flex;flex-direction:column}
.big .v{font-family:var(--fm);font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1}

  border-left:3px solid;background:var(--succ-bg);border-color:var(--success);color:#0a5c34}
.veredicto b{font-weight:700}

.sec{padding:34px 0 8px}
.sec h2{font-family:var(--fd);font-size:12px;font-weight:700;color:var(--ink-400);letter-spacing:.04em;margin-bottom:16px}
.dec{background:#fff;border:1px solid var(--ink-100);padding:22px 24px;margin-bottom:14px}
.dec h3{font-family:var(--fd);font-size:19px;font-weight:800;letter-spacing:-.01em}

.split{display:flex;gap:2px;margin:22px 0 10px;min-height:78px}
.split div{display:flex;flex-direction:column;justify-content:center;padding:12px 15px;color:#fff;overflow:hidden}
.split .a{background:var(--ll-black)} .split .b{background:var(--warning)}

input[type=range]{width:100%;accent-color:var(--ll-blue);height:26px}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:10px;margin-top:18px}
.opt{border:1px solid var(--ink-200);background:#fff;padding:14px 15px;text-align:left;transition:.12s}
.opt:hover{border-color:var(--ll-blue)}
.opt.on{border-color:var(--ll-blue);border-width:2px;background:var(--blue-050);padding:13px 14px}
.opt .t{font-family:var(--fd);font-weight:700;font-size:14px;line-height:1.25}
.opt .d{font-size:11.5px;color:var(--ink-500);margin-top:3px;line-height:1.35}
.opt .r{font-family:var(--fm);font-size:12px;color:var(--ll-blue);margin-top:9px;font-weight:500}
.opt.on .r{font-weight:700}
.supuesto{background:var(--ink-000);border:1px solid var(--ink-100);border-left:3px solid var(--ink-300);
  padding:16px 20px;margin-bottom:14px;font-size:13.5px;color:var(--ink-600);line-height:1.6}
.supuesto b{font-family:var(--fd);color:var(--ink-800);font-weight:700}
.supuesto .t{font-family:var(--fd);font-size:15px;font-weight:800;color:var(--ink-800);margin-bottom:6px}

details.det{background:#fff;border:1px solid var(--ink-100);margin-top:12px}
details.det>summary{padding:15px 22px;font-family:var(--fd);font-weight:700;font-size:14px;
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px}
details.det>summary::-webkit-details-marker{display:none}
details.det>summary::before{content:'+';font-family:var(--fm);color:var(--ll-blue);font-weight:700}
details.det[open]>summary::before{content:'–'}
details.det>summary .q{margin-left:auto;font-family:var(--fs);font-weight:400;font-size:12px;color:var(--ink-400)}
.det-bd{padding:0 22px 20px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--fd);font-size:11px;color:var(--ink-500);text-align:left;padding:7px 8px;
  border-bottom:2px solid var(--ll-black);font-weight:600;white-space:nowrap}
th.r,td.r{text-align:right}
th.grp{border-bottom:none;padding-bottom:2px;color:var(--ll-blue);font-size:10.5px;letter-spacing:.04em}
th.grp.w{color:var(--ink-400)}
td{padding:7px 8px;border-bottom:1px solid var(--ink-100);color:var(--ink-700);white-space:nowrap}
td.n{font-family:var(--fm);font-size:12px}
td.sep,th.sep{border-left:1px solid var(--ink-200)}
tr.tot td{border-top:2px solid var(--ll-black);border-bottom:none;font-weight:700;background:var(--ink-050)}
tr.tot td.n{color:var(--ll-blue)}
.pill{font-family:var(--fd);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:2px}
.pill.alt{background:var(--blue-050);color:var(--ll-blue)}
.pill.den{background:var(--warn-bg);color:var(--warning)}
.pill.ret{background:var(--ink-050);color:var(--ink-600)}
.nota{font-size:12px;color:var(--ink-500);line-height:1.55;margin-top:12px}
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{background:var(--ll-black);color:#fff;border:1px solid var(--ll-black);padding:10px 17px;
  font-family:var(--fd);font-size:13.5px;font-weight:600}
.btn:hover{background:var(--ll-blue);border-color:var(--ll-blue)}
.btn.g{background:#fff;color:var(--ink-700);border-color:var(--ink-200)}
.btn.g:hover{color:var(--ll-blue);border-color:var(--ll-blue)}
.msg{font-family:var(--fm);font-size:11.5px;color:var(--success)}
.foot{padding:26px 0 50px;font-size:11.5px;color:var(--ink-400);line-height:1.65}
@media print{ .res{position:static} .dec,.acts,.btn{display:none} details.det{border:none} details.det>summary{display:none} .det-bd{padding:0} }
@media (max-width:640px){ .hero h1{font-size:26px} .nums{gap:20px} .big .v{font-size:23px} }
</style></head>
<body>

<div class="hero"><div class="shell">
  <div class="mark">LUXIA<span>Labs</span></div>
  <h1>Sarasota × Las Ninfas</h1>
  <p>Dos variables mueven el resultado del conjunto: cómo se reparte la esquina entre oficinas y condohotel,
     y cómo se comporta el mercado. Todo lo demás queda fijo en los supuestos del estudio.</p>
</div></div>

<div class="res"><div class="shell" id="resumen"></div></div>

<div class="shell">
  <div class="sec"><h2>Las decisiones</h2><div id="decisiones"></div></div>
  <div class="sec"><h2>El detalle</h2><div id="supuestos"></div><div id="detalle"></div>
    <div class="acts">
      <button class="btn" onclick="guardar()">Guardar este ejercicio</button>
      <button class="btn g" onclick="reset()">Volver al escenario de partida</button>
      <button class="btn g" onclick="window.print()">Imprimir</button>
      <span class="msg" id="msg"></span>
    </div>
    <div id="comparar"></div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ==================== NORMATIVA ==================== */
const NORMAS = {
  sarasota:{ nombre:'Av. Sarasota', corto:'Sarasota', maxNiveles:15, densidad:1600 },
  helios:{ nombre:'C/ Helios', corto:'Helios', maxNiveles:6, densidad:1000 }
};
/* huella construible según retiros:
   hasta 9 niveles → frontal 5.00, laterales y posterior 3.00
   de 10 a 15      → frontal 7.00, laterales y posterior 2.80                      */
function ocupacionNorma(uso, suelo, banda){
  if (uso==='corporativo') return suelo > 2000 ? 0.60 : 0.58;
  if (banda==='alta') return suelo < 1000 ? 0.54 : 0.58;
  return suelo <= 1000 ? 0.63 : 0.66;
}
/* producto fijo del estudio */
const PRODUCTO = {
  residencial:{ m2:130, hab:4.5, txt:'apartamentos de 3 y 4 habitaciones, 130 m² promedio' },
  condohotel:{ m2:80, hab:3, txt:'unidades de 80 m² promedio' }
};

const BASE = {
  parcelas:{
    t1:{nombre:'Terreno 1',area:1112,norma:'sarasota'}, t2:{nombre:'Terreno 2',area:893,norma:'sarasota'},
    t3:{nombre:'Terreno 3',area:893,norma:'helios'},    t4:{nombre:'Terreno 4',area:827,norma:'sarasota'},
    t5:{nombre:'Terreno 5',area:830,norma:'sarasota'},  t6:{nombre:'Terreno 6',area:850,norma:'sarasota'},
    t78:{nombre:'Terrenos 7 y 8',area:1200,norma:'sarasota'}, t910:{nombre:'Terrenos 9 y 10',area:2330,norma:'sarasota'},
    t11:{nombre:'Terreno 11',area:990,norma:'helios'},  t12:{nombre:'Terreno 12',area:1930,norma:'helios'}
  },
  proyectos:[
    {id:'corp', nombre:'Torre de oficinas', corto:'Oficinas', solares:['t1','t2'], uso:'corporativo', fase:'F1', m2Parq:30, parqSot:70},
    {id:'hotel', nombre:'Condohotel', corto:'Condohotel', solares:['t3'], uso:'condohotel', fase:'F1', parqUnid:2, parqSot:23},
    {id:'r4', nombre:'Residencial · Terreno 4', corto:'Residencial T4', solares:['t4'], uso:'residencial', fase:'F1', parqUnid:2, parqSot:21},
    {id:'r5', nombre:'Residencial · Terreno 5', corto:'Residencial T5', solares:['t5'], uso:'residencial', fase:'F2', parqUnid:2, parqSot:21},
    {id:'r6', nombre:'Residencial · Terreno 6', corto:'Residencial T6', solares:['t6'], uso:'residencial', fase:'F2', parqUnid:2, parqSot:21},
    {id:'r78', nombre:'Residencial · Terrenos 7 y 8', corto:'Residencial T7-8', solares:['t78'], uso:'residencial', fase:'F2', parqUnid:2, parqSot:37},
    {id:'r910', nombre:'Residencial · Terrenos 9 y 10', corto:'Residencial T9-10', solares:['t910'], uso:'residencial', fase:'F2', parqUnid:2, parqSot:82},
    {id:'r11', nombre:'Residencial · Terreno 11', corto:'Residencial T11', solares:['t11'], uso:'residencial', fase:'F2', parqUnid:2, parqSot:28},
    {id:'r12', nombre:'Residencial · Terreno 12', corto:'Residencial T12', solares:['t12'], uso:'residencial', fase:'F2', parqUnid:2, parqSot:66}
  ],
  precios:{corporativo:4000, condohotel:3000, residencial:2800},
  costos:{corporativo:1700, condohotel:1500, residencial:1500},
  /* preventa fija: promedio del estudio */
  preventa:{corporativo:{pct:0,desc:0,cobro:0},
            condohotel:{pct:.40,desc:.06,cobro:.35},
            residencial:{pct:.25,desc:.06,cobro:.30}},
  fin:{precioSuelo:2350, comision:.05, soft:.05, imp:.10, circCorp:.25, circRes:.17, varPrecio:0, varCosto:0}
};
const clone = o => JSON.parse(JSON.stringify(o));

/* ==================== MOTOR ==================== */
function calcProyecto(p, s){
  const kP = 1+s.fin.varPrecio, kC = 1+s.fin.varCosto;
  const sol = p.solares.map(id=>s.parcelas[id]);
  const suelo = sol.reduce((a,b)=>a+b.area,0);
  const normaId = sol.length===1 ? sol[0].norma
    : Object.entries(sol.reduce((a,x)=>((a[x.norma]=(a[x.norma]||0)+x.area),a),{})).sort((a,b)=>b[1]-a[1])[0][0];
  const norma = NORMAS[normaId], maxNiv = norma.maxNiveles;
  const habPermitidos = suelo/10000*norma.densidad;
  const circ = p.uso==='corporativo' ? s.fin.circCorp : s.fin.circRes;
  const prod = PRODUCTO[p.uso];

  const evalBanda = (banda)=>{
    if (banda==='alta' && maxNiv<10) return null;
    const occ = ocupacionNorma(p.uso, suelo, banda);
    const huella = suelo*occ, huellaVend = huella*(1-circ);
    let nivDens = Infinity, unidPiso = 0, habPiso = 0;
    if (prod){
      unidPiso = huellaVend/prod.m2;          /* la planta se llena con el producto promedio */
      habPiso = unidPiso*prod.hab;
      nivDens = habPiso>0 ? habPermitidos/habPiso : Infinity;
    }
    let niv = Math.round(Math.min(maxNiv, nivDens));   /* pisos enteros */
    if (banda==='baja') niv = Math.min(niv, 9);
    else if (niv < 10) return null;
    if (niv < 1) return null;
    return {banda, occ, huella, huellaVend, unidPiso, habPiso, nivDens, niveles:niv, vendible:huellaVend*niv};
  };
  const best = ['baja','alta'].map(evalBanda).filter(Boolean).reduce((a,b)=> b.vendible>a.vendible ? b : a);
  const o = {...p, suelo, norma, normaId, habPermitidos, maxNiv, ...best};

  if (!prod){ o.unidades = null; o.m2Unidad = 0; o.habModelados = 0; }
  else {
    /* la mezcla de unidades se ajusta para no pasar de los habitantes permitidos */
    o.unidades = Math.max(1, Math.min(Math.floor(habPermitidos/prod.hab), Math.floor(o.vendible/45)));
    o.m2Unidad = o.vendible/o.unidades;
    o.habModelados = o.unidades*prod.hab;
  }
  o.holgura = prod ? habPermitidos - o.habModelados : Infinity;
  /* qué frena la altura */
  o.limita = !prod ? 'altura'
    : (o.niveles >= maxNiv-0.01 ? 'altura'
      : (o.holgura <= habPermitidos*0.03 ? 'densidad'
        : (o.banda==='baja' && o.niveles>=9 ? 'retiros' : 'densidad')));
  o.parqueos = prod ? o.unidades*p.parqUnid : o.vendible/p.m2Parq;
  o.sotanos = o.parqueos/p.parqSot;

  const precio = s.precios[p.uso]*kP;
  const pv = s.preventa[p.uso];
  o.ingresos = o.vendible*precio*(1-pv.pct*pv.desc);
  o.cTerreno = -suelo*s.fin.precioSuelo;
  o.cObra = -o.vendible*s.costos[p.uso]*kC;
  o.cVenta = -o.ingresos*(s.fin.comision+s.fin.soft);
  o.bruta = o.ingresos+o.cTerreno+o.cObra+o.cVenta;
  o.impuestos = -o.bruta*s.fin.imp;
  o.neta = o.bruta+o.impuestos;
  o.margen = o.ingresos? o.neta/o.ingresos : 0;
  o.caja = o.vendible*pv.pct*precio*(1-pv.desc)*pv.cobro;
  return o;
}
function calc(s){
  const P = s.proyectos.map(p=>calcProyecto(p,s)), byId={}; P.forEach(p=>byId[p.id]=p);
  const agg = a=>{ const o={};
    ['suelo','vendible','huella','ingresos','cTerreno','cObra','cVenta','bruta','impuestos','neta','caja','parqueos','habPermitidos','habModelados']
      .forEach(k=>o[k]=a.reduce((x,y)=>x+(y[k]||0),0));
    o.unidades = a.reduce((x,y)=>x+(y.unidades||0),0);
    o.margen = o.ingresos? o.neta/o.ingresos:0; return o; };
  return {P, byId, f1:agg(P.filter(p=>p.fase==='F1')), f2:agg(P.filter(p=>p.fase==='F2')), total:agg(P)};
}

/* ==================== OPCIONES ==================== */
const MERCADOS = {
  base:{ t:'Como hoy', d:'Precios y costos sin cambios', p:0, c:0 },
  favorable:{ t:'Precio arriba, costo abajo', d:'El mejor escenario', p:.10, c:-.10 },
  adverso:{ t:'Precio abajo, costo arriba', d:'El peor escenario', p:-.10, c:.10 },
  enfriamiento:{ t:'Todo baja', d:'Se enfría el mercado y la construcción', p:-.10, c:-.10 },
  inflacion:{ t:'Todo sube', d:'Inflación en obra y en venta', p:.10, c:.10 }
};
const DEFECTO = { corpSuelo:2005, mercado:'base' };
let op = {...DEFECTO};
function estado(o){
  const s = clone(BASE);
  s.parcelas.t2.area = Math.max(0, o.corpSuelo - s.parcelas.t1.area);
  s.parcelas.t3.area = 2898 - o.corpSuelo;
  s.fin.varPrecio = MERCADOS[o.mercado].p;
  s.fin.varCosto  = MERCADOS[o.mercado].c;
  return s;
}
const REFERENCIA = { ingresos:155420060, neta:31719266 };

/* ==================== FORMATO ==================== */
const nf=(v,d=0)=> (v==null||!isFinite(v))?'—':v.toLocaleString('es-DO',{minimumFractionDigits:d,maximumFractionDigits:d});
const M=v=>'US$'+(v/1e6).toLocaleString('es-DO',{minimumFractionDigits:1,maximumFractionDigits:1})+'M';
const money=v=> v<0? '('+nf(Math.abs(v))+')' : nf(v);
const pct=(v,d=1)=> isFinite(v)? (v*100).toFixed(d)+'%':'—';
let guardados = [];

/* ==================== RENDER ==================== */
function render(){
  const R = calc(estado(op));
  const corp = R.byId.corp, hotel = R.byId.hotel;

  /* --- resumen --- */
  const dif = R.total.neta - REFERENCIA.neta;
  const D = calc(estado(DEFECTO));
  const difBase = R.total.neta - D.total.neta;
  document.getElementById('resumen').innerHTML = `
    <div class="nums">
    <div class="big b"><div class="v">${M(R.total.neta)}</div><div class="k">Utilidad neta del conjunto</div>
      <div class="d ${dif>=0?'up':'down'}">${dif>=0?'▲':'▼'} ${M(Math.abs(dif))} vs. lo presentado</div></div>
    <div class="big"><div class="v">${M(R.total.ingresos)}</div><div class="k">Ingresos por ventas</div>
      <div class="d" style="color:var(--ink-400)">${nf(R.total.vendible)} m² vendibles</div></div>
    <div class="big"><div class="v">${pct(R.total.margen)}</div><div class="k">Margen neto</div>
      <div class="d" style="color:var(--ink-400)">${nf(R.total.unidades)} unidades + oficinas</div></div>
    <div class="big"><div class="v">${M(R.total.caja)}</div><div class="k">Caja durante la obra</div>
      <div class="d" style="color:var(--ink-400)">la aporta la preventa</div></div>
    </div>
    <div class="veredicto">${
      Math.abs(difBase) < 50000
      ? `<b>Escenario de partida.</b> Todo el conjunto queda dentro de la normativa de cada solar.
         Mové el reparto de la esquina o el escenario de mercado.`
      : `<b>${difBase>0?'Este escenario mejora':'Este escenario cuesta'} ${M(Math.abs(difBase))}</b>
         contra el punto de partida. El conjunto sigue dentro de la normativa de cada solar.`}</div>`;

  /* --- decisiones --- */
  document.getElementById('decisiones').innerHTML = `
  <div class="dec">
    <h3>Cómo se reparte la esquina</h3>
    <div class="sub">Los terrenos 1, 2 y 3 son un solo predio, pero la mitad que da a la calle Helios tiene
      una normativa más restrictiva: seis niveles en vez de quince y mil habitantes por hectárea en vez de mil
      seiscientos. Cada metro de suelo que pasa a esa mitad rinde menos metros vendibles.</div>
    <div class="split">
      <div class="a" style="flex:${op.corpSuelo}"><strong>${nf(corp.suelo)} m²</strong>
        <em>Oficinas · av. Sarasota</em>
        <div class="q">${nf(corp.niveles)} niveles · ${nf(corp.vendible)} m² vendibles · ${M(corp.neta)}</div></div>
      <div class="b" style="flex:${2898-op.corpSuelo}"><strong>${nf(hotel.suelo)} m²</strong>
        <em>Condohotel · c/ Helios</em>
        <div class="q">${nf(hotel.niveles)} niveles · ${nf(hotel.unidades)} unidades · ${M(hotel.neta)}</div></div>
    </div>
    <input type="range" min="1112" max="2500" step="1" value="${op.corpSuelo}"
      oninput="op.corpSuelo=+this.value; render()">
    <div class="ticks"><span>Más condohotel</span>
      <span>${(op.corpSuelo/2898*100).toFixed(0)}% del predio a oficinas</span><span>Más oficinas</span></div>
  </div>

  <div class="dec">
    <h3>Qué pasa si el mercado se mueve</h3>
    <div class="sub">El mismo programa construido con precios de venta y costos de construcción distintos,
      diez por ciento arriba o abajo. El precio del suelo no cambia en ningún caso.</div>
    <div class="opts">${Object.entries(MERCADOS).map(([k,cfg])=>{
      const alt = calc(estado({...op, mercado:k})).total;
      return `<button class="opt ${op.mercado===k?'on':''}" onclick="op.mercado='${k}'; render()">
        <div class="t">${cfg.t}</div><div class="d">${cfg.d}</div>
        <div class="r">${M(alt.neta)} · margen ${pct(alt.margen)}</div></button>`;
    }).join('')}</div>
  </div>`;

  /* --- supuestos fijos --- */
  document.getElementById('supuestos').innerHTML = `<div class="supuesto">
    <div class="t">Lo que queda fijo en todos los escenarios</div>
    <b>Producto residencial:</b> ${PRODUCTO.residencial.txt}, mezcla de tres habitaciones (cuatro habitantes)
    y cuatro habitaciones (cinco habitantes), lo que da un promedio de ${PRODUCTO.residencial.hab} habitantes
    por unidad. Todo el conteo de densidad sale de ese promedio.<br>
    <b>Condohotel:</b> ${PRODUCTO.condohotel.txt} y ${PRODUCTO.condohotel.hab} habitantes por unidad.<br>
    <b>Preventa:</b> 40% de las unidades del condohotel y 25% de las residenciales, con 6% de descuento
    sobre el precio de lista y cobro de un tercio durante la obra.<br>
    <b>Precios y costos:</b> suelo US$${nf(BASE.fin.precioSuelo)}/m²; venta de
    US$${nf(BASE.precios.corporativo)}, US$${nf(BASE.precios.condohotel)} y US$${nf(BASE.precios.residencial)}/m²
    en oficinas, condohotel y residencial; obra de US$${nf(BASE.costos.corporativo)} y
    US$${nf(BASE.costos.condohotel)}/m². Comisión 5%, soft costs 5% e impuesto de fideicomiso 10% sobre la utilidad.
  </div>`;

  /* --- detalle --- */
  const pill = { altura:['alt','Altura permitida'], densidad:['den','Densidad'], retiros:['ret','Retiros'] };
  document.getElementById('detalle').innerHTML = `
    <details class="det"><summary>El resultado en dinero<span class="q">edificio por edificio</span></summary>
      <div class="det-bd"><table>
        <tr><th>Proyecto</th><th class="r">m² vendibles</th><th class="r">Ingresos</th><th class="r">Terreno</th>
          <th class="r">Construcción</th><th class="r">Comisión y soft costs</th><th class="r">Impuesto</th>
          <th class="r">Utilidad neta</th><th class="r">Margen</th></tr>
        ${R.P.map(p=>`<tr><td>${p.nombre}${p.fase==='F2'?' <span style="color:var(--ink-400)">· etapa 2</span>':''}</td>
          <td class="n r">${nf(p.vendible)}</td><td class="n r">${money(p.ingresos)}</td>
          <td class="n r">${money(p.cTerreno)}</td><td class="n r">${money(p.cObra)}</td>
          <td class="n r">${money(p.cVenta)}</td><td class="n r">${money(p.impuestos)}</td>
          <td class="n r">${money(p.neta)}</td><td class="n r">${pct(p.margen)}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td class="n r">${nf(R.total.vendible)}</td>
          <td class="n r">${money(R.total.ingresos)}</td><td class="n r">${money(R.total.cTerreno)}</td>
          <td class="n r">${money(R.total.cObra)}</td><td class="n r">${money(R.total.cVenta)}</td>
          <td class="n r">${money(R.total.impuestos)}</td><td class="n r">${money(R.total.neta)}</td>
          <td class="n r">${pct(R.total.margen)}</td></tr></table>
        <p class="nota">Utilidad antes de costo financiero: la estructura de capital queda fuera de este modelo.</p>
      </div></details>

    <details class="det"><summary>Lo que permite la normativa<span class="q">no depende del proyecto</span></summary>
      <div class="det-bd"><table>
        <tr><th>Solar</th><th class="r">Superficie</th><th>Frente</th><th class="r">Altura máxima</th>
          <th class="r">Densidad</th><th class="r">Habitantes permitidos</th><th class="r">Ocupación del suelo</th></tr>
        ${R.P.map(p=>`<tr><td>${p.nombre}</td><td class="n r">${nf(p.suelo)} m²</td>
          <td>${p.norma.nombre}</td><td class="n r">${p.maxNiv} niveles</td>
          <td class="n r">${nf(p.norma.densidad)} hab/Ha</td>
          <td class="n r">${p.uso==='corporativo'?'no aplica':nf(p.habPermitidos,0)}</td>
          <td class="n r">${pct(p.occ,0)}</td></tr>`).join('')}
      </table>
      <p class="nota">Esta tabla es solo normativa: es el techo de cada solar antes de dibujar nada.
        La altura máxima son quince niveles con frente a la avenida Sarasota y seis hacia la calle Helios.
        La ocupación del suelo sale de los retiros que aplican a la altura de cada edificio: hasta nueve niveles
        se ocupa 63% del solar (66% si pasa de 1,000 m²), y del décimo al quinceavo los retiros crecen y baja a
        54% (58% si pasa de 1,000 m²). En oficinas sobre 2,000 m² es 60%. El corporativo no computa densidad
        habitacional: su techo es la altura y la dotación de parqueos.</p>
      </div></details>

    <details class="det"><summary>Lo que logra cada edificio<span class="q">resultado del ejercicio</span></summary>
      <div class="det-bd"><table>
        <tr><th></th><th class="grp r" colspan="2">Planta</th>
          <th class="grp w r sep" colspan="3">Lo que se construye</th>
          <th class="grp w r sep" colspan="3">Contra el techo normativo</th></tr>
        <tr><th>Proyecto</th><th class="r">Huella</th><th class="r">Planta vendible</th>
          <th class="r sep">Niveles</th><th class="r">Unidades</th><th class="r">m² vendibles</th>
          <th class="r sep">Habitantes usados</th><th class="r">Sobra</th><th>Qué frena la altura</th></tr>
        ${R.P.map(p=>`<tr><td>${p.nombre}</td>
          <td class="n r">${nf(p.huella)} m²</td><td class="n r">${nf(p.huellaVend)} m²</td>
          <td class="n r sep">${nf(p.niveles)} de ${p.maxNiv}</td>
          <td class="n r">${p.unidades!==null?nf(p.unidades)+' de '+nf(p.m2Unidad)+' m²':'oficinas'}</td>
          <td class="n r">${nf(p.vendible)}</td>
          <td class="n r sep">${p.unidades!==null?nf(p.habModelados,0)+' de '+nf(p.habPermitidos,0):'—'}</td>
          <td class="n r">${p.unidades!==null?nf(p.holgura,0):'—'}</td>
          <td><span class="pill ${pill[p.limita][0]}">${pill[p.limita][1]}</span></td></tr>`).join('')}
      </table>
      <p class="nota">Ningún residencial llega a los quince niveles que permite la avenida: se agotan antes
        los habitantes que permite la densidad. Con apartamentos de este tamaño, cada planta consume entre
        trece y quince habitantes, y el solar solo da para ciento treinta y pico. Ahí está la diferencia entre
        lo permitido y lo alcanzable.<br><br>
        Además, en los solares de la Sarasota el simulador compara las dos bandas de retiro y se queda con la
        que rinde más: por eso el T4, el T5 y el T6 se quedan en nueve niveles con planta grande, en vez de
        subir a diez con una planta casi 15% menor. Las unidades se ajustan para no pasar de los habitantes
        permitidos, por eso el tamaño promedio se mueve unos metros de un edificio a otro.</p>
      </div></details>`;

  renderComparar();
  document.getElementById('foot').innerHTML = `Luxia Labs · preparado para Marlen Mejía ·
    ${new Date().toLocaleDateString('es-DO',{month:'long',year:'numeric'})}. Estudio de prefactibilidad:
    los números son referenciales y se cierran en anteproyecto. Los niveles se expresan en enteros y las unidades
    se ajustan a la densidad de cada solar. Referencia presentada: ${M(REFERENCIA.ingresos)} de ingresos y
    ${M(REFERENCIA.neta)} de utilidad neta.`;
}
function reset(){ op={...DEFECTO}; render(); flash('Volviste al escenario de partida'); }
function guardar(){
  const R = calc(estado(op));
  guardados.push({ n:guardados.length+1, op:{...op}, corp:R.byId.corp.suelo, hotel:R.byId.hotel.suelo,
    mercado:MERCADOS[op.mercado].t, vend:R.total.vendible, unid:R.total.unidades,
    ing:R.total.ingresos, neta:R.total.neta, margen:R.total.margen, caja:R.total.caja });
  flash('Ejercicio guardado'); renderComparar();
}
function renderComparar(){
  const h = document.getElementById('comparar');
  if (!guardados.length){ h.innerHTML=''; return; }
  h.innerHTML = `<details class="det" open><summary>Ejercicios guardados</summary><div class="det-bd">
    <table><tr><th>#</th><th class="r">Oficinas</th><th class="r">Condohotel</th><th>Mercado</th>
      <th class="r">m² vendibles</th><th class="r">Unidades</th><th class="r">Ingresos</th>
      <th class="r">Utilidad neta</th><th class="r">Margen</th><th class="r">Caja en obra</th><th></th></tr>
      ${guardados.map((g,i)=>`<tr><td>${g.n}</td><td class="n r">${nf(g.corp)} m²</td>
        <td class="n r">${nf(g.hotel)} m²</td><td>${g.mercado}</td><td class="n r">${nf(g.vend)}</td>
        <td class="n r">${nf(g.unid)}</td><td class="n r">${money(g.ing)}</td>
        <td class="n r">${money(g.neta)}</td><td class="n r">${pct(g.margen)}</td>
        <td class="n r">${money(g.caja)}</td>
        <td class="r"><button class="btn g" style="padding:3px 9px;font-size:12px"
          onclick="op={...guardados[${i}].op}; render()">Cargar</button></td></tr>`).join('')}
    </table><p class="nota">Los ejercicios se pierden al cerrar la página. Imprimí o guardá el PDF para conservarlos.</p>
  </div></details>`;
}
function flash(m){ const e=document.getElementById('msg'); e.textContent=m; setTimeout(()=>e.textContent='',2600); }
render();
</script>
</body></html>
